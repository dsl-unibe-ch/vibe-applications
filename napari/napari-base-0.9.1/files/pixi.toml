[workspace]
channels = ["conda-forge"]
name = "napari-0.9.1"
platforms = ["linux-64"]

[environments]
napari-base-default = { features = ["napari-base-default"], no-default-feature = true }

[feature.napari-base-default.dependencies]
python = "3.13.*"
napari = "==0.9.1"
pyqt6 = "==6.8.1"
napari-animation = "==0.0.9"
napari-skimage = "==0.7.1"
napari-threedee = "==0.0.28"
jupyterlab = "==4.6.3"
pandas = "==3.0.5"
seaborn = "==0.13.2"


[feature.napari-base-default.pypi-dependencies]
ndevio = "==0.10.0"
bioio-czi = "==2.9.1"
bioio-dv = "==1.2.0"
bioio-nd2 = "==2.4.0"
bioio-lif = "==1.5.0"


[feature.napari-base-default]
channels = ["conda-forge"]
