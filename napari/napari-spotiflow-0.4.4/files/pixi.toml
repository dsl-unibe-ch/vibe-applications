[workspace]
authors = ["Guillaume Witz <guillaume.witz@unibe.ch>"]
channels = ["conda-forge"]
name = "napari-spotiflow-0.4.4"
platforms = ["linux-64"]

[environments]
napari-spotiflow-default = ["napari-spotiflow-default"]

[feature.napari-spotiflow-default.system-requirements]
cuda = "12.0"

[tasks]

[dependencies]

[feature.napari-spotiflow-default.dependencies]
napari = "*"
pyqt = "*"
jupyterlab = "*"
napari-skimage = "*"
cuda-version = "12.9*"
python = "3.12.*"
pytorch-gpu = "==2.10"

[feature.napari-spotiflow-default.pypi-dependencies]
napari-spotiflow = "==0.4.4"
ndevio = ">=0.9.0, <0.10"
bioio-czi = "*"
bioio-dv = "*"
bioio-nd2 = "*"
bioio-lif = "*"
torchvision = ">=0.25"
