[workspace]
channels = ["conda-forge"]
name = "jupyterlab-vedo-2026.6.1"
platforms = ["linux-64"]

[environments]
jupyterlab-vedo-default = { features = ["jupyterlab-vedo-default"], no-default-feature = true }

[feature.jupyterlab-vedo-default.dependencies]
python = "3.12.*"
vedo = "==2026.6.1"
napari = "*"
pyqt = "*"
napari-skimage = "*"
jupyterlab = "*"
pip = "*"

[feature.jupyterlab-vedo-default.pypi-dependencies]
napari-vedo-bridge = "*"
ndevio = "*"
bioio-czi = "*"
bioio-dv = "*"
bioio-nd2 = "*"
bioio-lif = "*"
k3d = ">=2.17.0, <3"
